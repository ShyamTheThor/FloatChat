services:
  postgres:
    image: postgres:15-alpine
    container_name: floatchat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-floatchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floatchat_dev}
      POSTGRES_DB: ${POSTGRES_DB:-argo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floatchat} -d ${POSTGRES_DB:-argo}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
