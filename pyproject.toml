[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "floatchat-pipeline"
version = "0.1.0"
description = "FloatChat data pipeline — parses ARGO ocean float data into PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # HTTP & data fetching
    "requests>=2.31",
    # NetCDF / scientific data
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "numpy>=1.26",
    "pandas>=2.2",
    # PostgreSQL
    "psycopg2-binary>=2.9",
    # Environment / config
    "python-dotenv>=1.0",
    # Progress display
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
